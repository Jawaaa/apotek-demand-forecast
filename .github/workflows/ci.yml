name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Verify Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.110.0 pydantic==2.6.0 sqlalchemy==2.0.25
          pip install pytest==8.0.0 httpx==0.27.0
          pip install numpy pandas scikit-learn joblib

      - name: Check Python syntax (api)
        run: |
          python -m py_compile api/main.py
          python -m py_compile api/database.py
          python -m py_compile api/schemas.py
          python -m py_compile api/model_loader.py
          echo "✅ API files valid"

      - name: Check Python syntax (ui)
        run: |
          python -m py_compile ui/app.py
          python -m py_compile ui/utils.py
          echo "✅ UI files valid"

      - name: Check Python syntax (tests)
        run: |
          python -m py_compile tests/test_api.py
          echo "✅ Test files valid"

      - name: Verify imports
        run: |
          python -c "import ast; ast.parse(open('api/main.py').read()); print('✅ api/main.py parse OK')"
          python -c "import ast; ast.parse(open('ui/app.py').read()); print('✅ ui/app.py parse OK')"
          python -c "import ast; ast.parse(open('tests/test_api.py').read()); print('✅ tests/test_api.py parse OK')"

      - name: Summary
        run: |
          echo "🎉 CI Passed! Semua file Python valid."